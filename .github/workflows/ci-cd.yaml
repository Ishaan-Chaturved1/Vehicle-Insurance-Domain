name: Vehicle Insurance CI/CD

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: vehicle-insurance
  EKS_CLUSTER_NAME: my-eks-cluster
  K8S_NAMESPACE: default

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v6

      # 2. Set up Python
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      # 3. Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      # 4. Verify Python and pytest
      - name: Verify Python and pytest
        run: |
          python --version
          python -m pip --version
          python -m pip show pytest
          python -m pytest --version

      # 5. Run tests
      - name: Run tests
        run: |
          python -m pytest -q

      # 6. Configure AWS using GitHub OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::685248003104:role/GitHubActions-VehicleInsurance
          aws-region: ${{ env.AWS_REGION }}

      # 7. Verify AWS identity
      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      # 8. Login to Amazon ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 9. Build Docker image
      - name: Build Docker image
        run: |
          docker build \
            -t ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }} \
            -t ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest \
            .

      # 10. Push Docker image to ECR
      - name: Push Docker image
        run: |
          docker push ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          docker push ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest

      # 11. Configure kubectl for EKS
      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region ${{ env.AWS_REGION }} \
            --name ${{ env.EKS_CLUSTER_NAME }}

      # 12. Verify Kubernetes access
      - name: Verify Kubernetes access
        run: |
          kubectl get deployment \
            --namespace ${{ env.K8S_NAMESPACE }}

      # 13. Deploy new Docker image
      - name: Deploy to EKS
        run: |
          kubectl set image \
            deployment/vehicle-insurance \
            vehicle-insurance=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }} \
            --namespace ${{ env.K8S_NAMESPACE }}

      # 14. Wait for rolling deployment
      - name: Verify deployment rollout
        run: |
          kubectl rollout status \
            deployment/vehicle-insurance \
            --namespace ${{ env.K8S_NAMESPACE }} \
            --timeout=5m

      # 15. Show final deployment status
      - name: Show deployment status
        run: |
          kubectl get deployment vehicle-insurance \
            --namespace ${{ env.K8S_NAMESPACE }}

          kubectl get pods \
            --namespace ${{ env.K8S_NAMESPACE }} \
            --selector=app=vehicle-insurance